services:
  db:
    image: postgres:15-alpine
    container_name: sgm_postgres
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${DB_USER:-sgm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sgm_password}
      POSTGRES_DB: ${DB_NAME:-sgm_db}
    ports:
      - "${DB_PORT_EXTERNAL:-5434}:5432"
    volumes:
      - sgm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sgm_user} -d ${DB_NAME:-sgm_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: sgm_app
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - .:/workspace
      - sgm_uploads:/workspace/BACKEND/uploads
    ports:
      - "${BACKEND_PORT:-8085}:8080"
      - "${FRONTEND_PORT:-5175}:5173"
    environment:
      - DB_DSN=host=db user=${DB_USER:-sgm_user} password=${DB_PASSWORD:-sgm_password} dbname=${DB_NAME:-sgm_db} port=5432 sslmode=disable TimeZone=America/Sao_Paulo
      - JWT_SECRET=${JWT_SECRET:-seu_jwt_secret_super_seguro_aqui}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-COLOQUE_SUA_API_KEY_AQUI}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - BASE_URL=${BASE_URL:-http://100.95.28.45:8085}
    command: bash /workspace/start.sh

volumes:
  sgm_pg_data:
    name: sgm_postgres_data
  sgm_uploads:
    name: sgm_uploads_data
